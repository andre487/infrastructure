- name: Create dedicated Docker network for MTG
  community.docker.docker_network:
    name: "{{ mtg_net_name }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ mtg_subnet }}"
        gateway: "{{ mtg_gateway }}"
    driver_options:
      com.docker.network.bridge.name: "{{ mtg_bridge_name }}"
  tags:
    - tg-proxy

- name: Configure SSH egress
  ansible.builtin.include_tasks: ssh.yml
  tags:
    - tg-proxy

- name: Ensure MTG config directory exists
  ansible.builtin.file:
    path: /etc/mtg
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - tg-proxy

- name: Check MTG secret file
  ansible.builtin.stat:
    path: /etc/mtg/secret.txt
  register: mtg_secret_file
  tags:
    - tg-proxy

- name: Generate MTG secret
  no_log: true
  ansible.builtin.command:
    cmd: docker run --rm nineseconds/mtg:2 generate-secret --hex "{{ fake_tls_domain }}"
  register: mtg_generated_secret
  changed_when: true
  when: not mtg_secret_file.stat.exists
  tags:
    - tg-proxy

- name: Save MTG secret
  no_log: true
  ansible.builtin.copy:
    dest: /etc/mtg/secret.txt
    content: "{{ mtg_generated_secret.stdout | trim }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not mtg_secret_file.stat.exists
  tags:
    - tg-proxy

- name: Read MTG secret
  no_log: true
  ansible.builtin.slurp:
    src: /etc/mtg/secret.txt
  register: mtg_secret_slurp
  tags:
    - tg-proxy

- name: Set MTG secret fact
  no_log: true
  ansible.builtin.set_fact:
    mtg_secret: "{{ mtg_secret_slurp.content | b64decode | trim }}"
  tags:
    - tg-proxy

- name: Create MTG link file
  no_log: true
  ansible.builtin.template:
    src: templates/link.txt.j2
    dest: /etc/mtg/link.txt
    owner: root
    group: root
    mode: "0600"
  tags:
    - tg-proxy

- name: Configure MTG
  no_log: true
  register: mtg_config
  ansible.builtin.template:
    src: templates/mtg.config.toml.j2
    dest: /etc/mtg/config.toml
    owner: root
    group: root
    mode: "0600"
  tags:
    - tg-proxy

- name: Run MTG container
  community.docker.docker_container:
    name: mtg-proxy
    image: nineseconds/mtg:2
    state: started
    restart_policy: unless-stopped
    pull: false
    recreate: "{{ mtg_config.changed }}"
    networks:
      - name: "{{ mtg_net_name }}"
    published_ports:
      - "0.0.0.0:443:3128/tcp"
      - "127.0.0.1:3129:3129/tcp"
    volumes:
      - /etc/mtg/config.toml:/config.toml:ro
    log_driver: journald
  tags:
    - tg-proxy

- name: Read MTG link
  no_log: true
  ansible.builtin.slurp:
    src: /etc/mtg/link.txt
  register: mtg_link_file
  tags:
    - tg-proxy

- name: Print MTG link
  no_log: true
  ansible.builtin.debug:
    msg: "{{ mtg_link_file.content | b64decode | trim }}"
  tags:
    - tg-proxy
